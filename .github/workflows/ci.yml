name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [intents-checkout, checkout-agent]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intents_checkout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intents_checkout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: "3000"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/intents_checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w ${{ matrix.project }} --if-present
      - run: npm run typecheck -w ${{ matrix.project }} --if-present
      - run: npm run test:unit -w ${{ matrix.project }} --if-present
      - run: npm run test:functional -w ${{ matrix.project }} --if-present
  policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-policy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
