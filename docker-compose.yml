services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intents_checkout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intents_checkout"]
      interval: 2s
      timeout: 5s
      retries: 20

  webhook-sink:
    image: node:24-bookworm-slim
    working_dir: /opt/sink
    volumes:
      - ./docker/webhook-sink.mjs:/opt/sink/webhook-sink.mjs:ro
    command: ["node", "webhook-sink.mjs"]

  intents-checkout:
    build:
      context: .
      dockerfile: intents-checkout/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      webhook-sink:
        condition: service_started
    environment:
      CHECKOUT_MODE: fake
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/intents_checkout
      PORT: "3000"
      MERCHANT_API_KEY: judge-merchant-key
      TREASURY_ACCOUNT_ID: treasury.near
      WEBHOOK_URL: http://webhook-sink:8080/
    ports:
      - "3000:3000"
